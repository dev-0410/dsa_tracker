name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invariant_test
          POSTGRES_USER: invariant
          POSTGRES_PASSWORD: invariant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invariant -d invariant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://invariant:invariant@localhost:5432/invariant_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-with-more-than-thirty-two-characters
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
      - run: npm run catalog:validate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config
      - run: docker build --target migrator --tag invariant-migrator:${{ github.sha }} .
      - run: docker build --target runner --tag invariant:${{ github.sha }} .
