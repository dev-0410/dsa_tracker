name: invariant

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invariant}
      POSTGRES_USER: ${POSTGRES_USER:-invariant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invariant-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru", "--requirepass", "${REDIS_PASSWORD:-invariant-local-only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-invariant-local-only}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invariant}:${POSTGRES_PASSWORD:-invariant-local-only}@postgres:5432/${POSTGRES_DB:-invariant}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cleanup:
    profiles: ["maintenance"]
    build:
      context: .
      target: migrator
    command: ["npm", "run", "db:cleanup"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invariant}:${POSTGRES_PASSWORD:-invariant-local-only}@postgres:5432/${POSTGRES_DB:-invariant}?schema=public
      RECOMMENDATION_RETENTION_DAYS: ${RECOMMENDATION_RETENTION_DAYS:-90}
      PLATFORM_SNAPSHOT_RETENTION_DAYS: ${PLATFORM_SNAPSHOT_RETENTION_DAYS:-365}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-invariant}:${POSTGRES_PASSWORD:-invariant-local-only}@postgres:5432/${POSTGRES_DB:-invariant}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-invariant-local-only}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      PLATFORM_SYNC_TTL_SECONDS: ${PLATFORM_SYNC_TTL_SECONDS:-900}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  redis_data:
